# Ambiente local (D13).
# As portas de management (9081 e 9082) nao sao publicadas: so `expose`.
name: kipay

services:
  accounts-db:
    image: ${POSTGRES_IMAGE:?defina POSTGRES_IMAGE no .env}
    environment:
      POSTGRES_DB: ${ACCOUNTS_DB_NAME:?}
      POSTGRES_USER: ${ACCOUNTS_DB_USER:?}
      POSTGRES_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger-db:
    image: ${POSTGRES_IMAGE:?defina POSTGRES_IMAGE no .env}
    environment:
      POSTGRES_DB: ${LEDGER_DB_NAME:?}
      POSTGRES_USER: ${LEDGER_DB_USER:?}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:?}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: ${KAFKA_IMAGE:?defina KAFKA_IMAGE no .env}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  keycloak:
    image: ${KEYCLOAK_IMAGE:?defina KEYCLOAK_IMAGE no .env}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    expose:
      - "9000"
    healthcheck:
      # A imagem nao tem curl nem wget: GET manual via /dev/tcp do bash, na porta de management.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  accounts:
    build:
      context: ..
      dockerfile: services/accounts/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://accounts-db:5432/${ACCOUNTS_DB_NAME:?}
      SPRING_DATASOURCE_USERNAME: ${ACCOUNTS_DB_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    expose:
      - "9081"
    depends_on:
      accounts-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ledger:
    build:
      context: ..
      dockerfile: services/ledger/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/${LEDGER_DB_NAME:?}
      SPRING_DATASOURCE_USERNAME: ${LEDGER_DB_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${LEDGER_DB_PASSWORD:?}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    expose:
      - "9082"
    depends_on:
      ledger-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
