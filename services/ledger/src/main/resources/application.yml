spring:
  application:
    name: ledger
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8082

management:
  server:
    port: 9082
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Exportação OTLP (traces, logs e métricas) desligada até a feature 8 (D12). O tracing segue ativo: traceId e spanId no MDC.
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ecs
